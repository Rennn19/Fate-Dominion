<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0e121e 0%, #171d2c 50%, #0a0d16 100%);
            background-attachment: fixed;
            color: #ece5d8;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('assets/images/bg.png'); 
            background-size: 50%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .font-genshin { font-family: 'Cinzel', serif; }
        .font-japan { font-family: 'Noto Serif JP', serif; }

        .genshin-card {
            background: rgba(23, 29, 44, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(204, 165, 102, 0.2);
            border-radius: 4px 20px 4px 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .genshin-card:hover {
            border-color: #cca566;
            box-shadow: 0 10px 30px rgba(204, 165, 102, 0.25), 0 0 15px rgba(204, 165, 102, 0.1);
        }

        .rarity-5 { background: linear-gradient(180deg, #513e6b 0%, #bfa054 100%); }
        .rarity-4 { background: linear-gradient(180deg, #64553b 0%, #bfa054 50%, #b8ac8c 100%); }
        .rarity-3 { background: linear-gradient(180deg, #b5b5b5 0%, #64696f 100%); }
        .rarity-master { background: linear-gradient(180deg, #1b263b 0%, #415a77 100%); }
        .rarity-npc { background: linear-gradient(180deg, #1e3a3a 0%, #2d5a4c 100%); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(14, 18, 30, 0.8); }
        ::-webkit-scrollbar-thumb { background: #cca566; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #e2be7d; }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes activePulse {
            0%, 100% { border-color: rgba(204, 165, 102, 1); box-shadow: 0 0 15px rgba(204, 165, 102, 0.6); }
            50% { border-color: rgba(255, 215, 0, 0.8); box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); }
        }
        .equipped-card {
            animation: activePulse 2.5s infinite ease-in-out;
        }

        @keyframes epicGlow {
            0%, 100% {
                box-shadow: 0 0 4px rgba(168, 85, 247, 0.4);
                border-color: rgba(168, 85, 247, 0.5);
            }
            50% {
                box-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
                border-color: rgba(216, 180, 254, 0.9);
            }
        }
        .skin-badge-epic {
            background: linear-gradient(135deg, rgba(58, 12, 89, 0.9), rgba(88, 28, 135, 0.9));
            color: #e9d5ff;
            border: 1px solid #a855f7;
            animation: epicGlow 2s ease-in-out infinite;
            will-change: box-shadow;
        }

        @keyframes legendShiny {
            0% {
                background-position: 200% 0;
                box-shadow: 0 0 5px rgba(245, 158, 11, 0.4);
            }
            50% {
                box-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
            }
            100% {
                background-position: -100% 0;
                box-shadow: 0 0 5px rgba(245, 158, 11, 0.4);
            }
        }
        .skin-badge-legend {
            background: linear-gradient(
                115deg,
                rgba(69, 26, 3, 0.9) 0%,
                rgba(146, 64, 14, 0.9) 35%,
                rgba(254, 240, 138, 0.95) 50%,
                rgba(146, 64, 14, 0.9) 65%,
                rgba(69, 26, 3, 0.9) 100%
            );
            background-size: 250% 100%;
            color: #fef08a;
            border: 1px solid #f59e0b;
            font-weight: 700;
            animation: legendShiny 2.5s ease-in-out infinite;
            will-change: background-position;
        }

        @keyframes grandGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes grandPulseAura {
            0%, 100% {
                box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 18px rgba(245, 158, 11, 0.5), inset 0 0 6px rgba(254, 240, 138, 0.6);
                border-color: #fef08a;
            }
            50% {
                box-shadow: 0 0 22px rgba(239, 68, 68, 1), 0 0 30px rgba(245, 158, 11, 0.9), 0 0 10px rgba(255, 255, 255, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.9);
                border-color: #ffffff;
            }
        }

        @keyframes grandLightSweep {
            0% { left: -120%; }
            35%, 100% { left: 220%; }
        }

        .skin-badge-grand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(
                115deg,
                #581c87 0%,
                #991b1b 20%,
                #b45309 40%,
                #fef08a 50%,
                #b45309 60%,
                #991b1b 80%,
                #581c87 100%
            );
            background-size: 280% 280%;
            color: #ffffff;
            border: 1px solid #fef08a;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-shadow: 0 0 6px rgba(254, 240, 138, 0.9), 0 0 12px rgba(239, 68, 68, 0.8);
            animation: grandGradient 3.5s ease infinite, grandPulseAura 1.8s ease-in-out infinite;
            will-change: background-position, box-shadow;
        }

        .skin-badge-grand:not(.absolute) {
            position: relative;
        }

        .skin-badge-grand::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.95) 50%,
                rgba(255, 255, 255, 0.2) 80%,
                transparent 100%
            );
            transform: skewX(-25deg);
            animation: grandLightSweep 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes collabPrism {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 0 8px rgba(34, 211, 238, 0.6), 0 0 16px rgba(236, 72, 153, 0.4);
                border-color: #38bdf8;
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 0 16px rgba(236, 72, 153, 0.8), 0 0 22px rgba(168, 85, 247, 0.6);
                border-color: #f472b6;
            }
        }

        .skin-badge-collab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(
                115deg,
                #0c4a6e 0%,
                #0284c7 25%,
                #be185d 50%,
                #6b21a8 75%,
                #0c4a6e 100%
            );
            background-size: 250% 250%;
            color: #f0fdf4;
            border: 1px solid #38bdf8;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-shadow: 0 0 6px rgba(34, 211, 238, 0.8), 0 0 10px rgba(236, 72, 153, 0.6);
            animation: collabPrism 3s ease-in-out infinite;
            will-change: background-position, box-shadow;
        }

        .skin-badge-collab:not(.absolute) {
            position: relative;
        }

        /* PAINTED SKIN / OUTFIT BADGE */
        @keyframes paintedShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .skin-badge-painted {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(115deg, #4c1d95 0%, #be185d 35%, #d97706 70%, #4c1d95 100%);
            background-size: 220% 220%;
            color: #fdf2f8;
            border: 1px solid #f472b6;
            font-weight: 700;
            animation: paintedShimmer 3s ease infinite;
        }
    </style>

        function getSeriesColorClass(series) {
            if (!series) return 'bg-sky-950/80 text-sky-300 border-sky-500/40';
            const s = series.trim().toLowerCase();

            if (s.includes('painted')) return 'skin-badge-painted';
            if (s.includes('epic') || s.includes('kaijuu') || s.includes('bride') || s.includes('lunar') || s.includes('formal')) return 'skin-badge-epic';
            if (s.includes('legend')) return 'skin-badge-legend';
            if (s.includes('grand')) return 'skin-badge-grand';
            if (s.includes('collab') || s.includes('crossover') || s.includes('#')) return 'skin-badge-collab';
            if (s.includes('elite')) return 'bg-emerald-950/80 text-emerald-300 border-emerald-500/50';

        function formatSeriesName(seriesText) {
            if (!seriesText) return '';
            let text = seriesText;

            const sortedCodes = Object.keys(COLLAB_LOGOS).sort((a, b) => b.length - a.length);
            sortedCodes.forEach(code => {
                if (text.includes(code)) {
                    text = text.replace(code, COLLAB_LOGOS[code].name).trim();
                }
            });

            return text;
        }

        function renderSeriesBadge(seriesText, extraClasses = '') {
            if (!seriesText) return '';

            const colorClass = getSeriesColorClass(seriesText);
            let displayText = seriesText;
            let iconHtml = '';

            const sortedCodes = Object.keys(COLLAB_LOGOS).sort((a, b) => b.length - a.length);
            const matchedCode = sortedCodes.find(code => seriesText.includes(code));

            if (matchedCode) {
                const logo = COLLAB_LOGOS[matchedCode];
                displayText = displayText.replace(matchedCode, '').trim();
                const marginClass = displayText ? 'mr-1' : '';
                iconHtml = `<img src="${logo.icon}" alt="${logo.name}" title="${logo.name}" class="w-8 h-8 inline-block object-contain shrink-0 align-middle ${marginClass}">`;
            }

            return `
                <span class="${colorClass} ${extraClasses} text-[8px] px-1.5 py-0.5 rounded font-semibold backdrop-blur-sm truncate inline-flex items-center justify-center">
                    ${iconHtml}
                    ${displayText ? `<span>${displayText}</span>` : ''}
                </span>
            `;
        }

        function getBadgeInnerContent(seriesText) {
            if (!seriesText) return '';

            let displayText = seriesText;
            let iconHtml = '';

            const sortedCodes = Object.keys(COLLAB_LOGOS).sort((a, b) => b.length - a.length);
            const matchedCode = sortedCodes.find(code => seriesText.includes(code));

            if (matchedCode) {
                const logo = COLLAB_LOGOS[matchedCode];
                displayText = displayText.replace(matchedCode, '').trim();
                const marginClass = displayText ? 'mr-1' : '';
                iconHtml = `<img src="${logo.icon}" alt="${logo.name}" title="${logo.name}" class="w-8 h-8 inline-block object-contain shrink-0 align-middle ${marginClass}">`;
            }

            return `${iconHtml}${displayText ? `<span>${displayText}</span>` : ''}`;

        let currentCategoryFilter = 'ALL';

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                const isPaintedBtn = btn.id === 'catBtnPAINTED';
                btn.className = isPaintedBtn
                    ? "cat-filter-btn bg-black/40 text-pink-300 hover:text-[#cca566] border border-pink-500/40 px-3.5 py-1.5 rounded-full transition-all cursor-pointer"
                    : "cat-filter-btn bg-black/40 text-gray-300 hover:text-[#cca566] border border-gray-700 px-3.5 py-1.5 rounded-full transition-all cursor-pointer";

        function resolveSeriesName(sprite, spriteIdx, defaultFirstLabel) {
            if (sprite.series) return sprite.series;
            const sNameLower = (sprite.name || '').toLowerCase();
            if (sNameLower.includes('uniform') || sNameLower.includes('school') || sNameLower.includes('seifuku') || sNameLower.includes('seragam')) {
                return 'Uniform Series';
            } else if (sNameLower.includes('summer') || sNameLower.includes('swimsuit') || sNameLower.includes('pantai')) {
                return 'Summer Series';
            } else if (sNameLower.includes('dress') || sNameLower.includes('formal') || sNameLower.includes('suit')) {
                return 'Special Series';
            }
            return spriteIdx === 0 ? defaultFirstLabel : 'Special Series';
        }

        function getAllSkinsList() {
            const servants = getServants();
            const masters = getMasters();
            const npcs = getNpcs();
            const skinList = [];

            // 1. SERVANTS (Original Skins + Painted Variants)
            servants.forEach(servant => {
                const sprites = (servant.sprites && servant.sprites.length > 0) 
                    ? servant.sprites 
                    : [{ name: "Default Stage", url: servant.image || "assets/images/favicon.png", paintedSkins: [] }];

                const activeSpriteIdx = servant.activeSpriteIndex || 0;
                const activePaintedIdx = servant.activePaintedIndex !== undefined ? servant.activePaintedIndex : -1;

                sprites.forEach((sprite, spriteIdx) => {
                    const baseSeriesName = resolveSeriesName(sprite, spriteIdx, 'Original Ascension');
                    const baseSkinName = sprite.name || `Stage ${spriteIdx + 1}`;
                    const finalImgUrl = sprite.url || sprite.imageUrl || servant.image || 'assets/images/favicon.png';
                    const isBaseEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === -1);

                    skinList.push({
                        id: `servant_${servant.id}_${spriteIdx}_base`,
                        ownerId: servant.id,
                        ownerType: 'SERVANT',
                        ownerName: servant.name,
                        ownerClass: servant.class || 'Servant',
                        rarity: servant.rarity || 5,
                        skinName: baseSkinName,
                        baseSkinName: null,
                        paintedName: null,
                        isPainted: false,
                        imageUrl: finalImgUrl,
                        spriteIndex: spriteIdx,
                        paintedIndex: -1,
                        isEquipped: isBaseEquipped,
                        series: baseSeriesName
                    });

                    // Tambahkan Painted Variants (mewarisi tag series skin original jika ps.series kosong)
                    const paintedList = sprite.paintedSkins || [];
                    paintedList.forEach((ps, pIdx) => {
                        const inheritedSeries = (ps.series && ps.series.trim()) ? ps.series.trim() : baseSeriesName;
                        const pName = ps.name || `Painted #${pIdx + 1}`;
                        const isPaintedEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === pIdx);

                        skinList.push({
                            id: `servant_${servant.id}_${spriteIdx}_painted_${pIdx}`,
                            ownerId: servant.id,
                            ownerType: 'SERVANT',
                            ownerName: servant.name,
                            ownerClass: servant.class || 'Servant',
                            rarity: servant.rarity || 5,
                            skinName: `${baseSkinName} (${pName})`,
                            baseSkinName: baseSkinName,
                            paintedName: pName,
                            isPainted: true,
                            imageUrl: ps.url || finalImgUrl,
                            spriteIndex: spriteIdx,
                            paintedIndex: pIdx,
                            isEquipped: isPaintedEquipped,
                            series: inheritedSeries
                        });
                    });
                });
            });

            // 2. MASTERS (Original Outfits + Painted Variants)
            masters.forEach(master => {
                const sprites = (master.sprites && master.sprites.length > 0) 
                    ? master.sprites 
                    : [{ name: "Default Outfit", url: master.image || "assets/images/favicon.png", paintedSkins: [] }];

                const activeSpriteIdx = master.activeSpriteIndex || 0;
                const activePaintedIdx = master.activePaintedIndex !== undefined ? master.activePaintedIndex : -1;

                sprites.forEach((sprite, spriteIdx) => {
                    const baseSeriesName = resolveSeriesName(sprite, spriteIdx, 'Mystic Code');
                    const baseOutfitName = sprite.name || `Outfit ${spriteIdx + 1}`;
                    const finalImgUrl = sprite.url || sprite.imageUrl || master.image || 'assets/images/favicon.png';
                    const isBaseEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === -1);

                    skinList.push({
                        id: `master_${master.id}_${spriteIdx}_base`,
                        ownerId: master.id,
                        ownerType: 'MASTER',
                        ownerName: master.name,
                        ownerClass: master.affiliation || 'Master',
                        rarity: 'MASTER',
                        skinName: baseOutfitName,
                        baseSkinName: null,
                        paintedName: null,
                        isPainted: false,
                        imageUrl: finalImgUrl,
                        spriteIndex: spriteIdx,
                        paintedIndex: -1,
                        isEquipped: isBaseEquipped,
                        series: baseSeriesName
                    });

                    // Tambahkan Painted Outfits (mewarisi tag series outfit original jika ps.series kosong)
                    const paintedList = sprite.paintedSkins || [];
                    paintedList.forEach((ps, pIdx) => {
                        const inheritedSeries = (ps.series && ps.series.trim()) ? ps.series.trim() : baseSeriesName;
                        const pName = ps.name || `Painted #${pIdx + 1}`;
                        const isPaintedEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === pIdx);

                        skinList.push({
                            id: `master_${master.id}_${spriteIdx}_painted_${pIdx}`,
                            ownerId: master.id,
                            ownerType: 'MASTER',
                            ownerName: master.name,
                            ownerClass: master.affiliation || 'Master',
                            rarity: 'MASTER',
                            skinName: `${baseOutfitName} (${pName})`,
                            baseSkinName: baseOutfitName,
                            paintedName: pName,
                            isPainted: true,
                            imageUrl: ps.url || finalImgUrl,
                            spriteIndex: spriteIdx,
                            paintedIndex: pIdx,
                            isEquipped: isPaintedEquipped,
                            series: inheritedSeries
                        });
                    });
                });
            });

            // 3. NPCS (Original Outfits + Painted Variants)
            npcs.forEach(npc => {
                const sprites = (npc.sprites && npc.sprites.length > 0) 
                    ? npc.sprites 
                    : [{ name: "Default Outfit", url: npc.image || "assets/images/favicon.png", paintedSkins: [] }];

                const activeSpriteIdx = npc.activeSpriteIndex || 0;
                const activePaintedIdx = npc.activePaintedIndex !== undefined ? npc.activePaintedIndex : -1;
                const cleanAffiliation = formatSeriesName(npc.affiliation || 'NPC');

                sprites.forEach((sprite, spriteIdx) => {
                    const baseSeriesName = resolveSeriesName(sprite, spriteIdx, 'Default Outfit');
                    const baseOutfitName = sprite.name || `Outfit ${spriteIdx + 1}`;
                    const finalImgUrl = sprite.url || sprite.imageUrl || npc.image || 'assets/images/favicon.png';
                    const isBaseEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === -1);

                    skinList.push({
                        id: `npc_${npc.id}_${spriteIdx}_base`,
                        ownerId: npc.id,
                        ownerType: 'NPC',
                        ownerName: npc.name,
                        ownerClass: cleanAffiliation,
                        rarity: 'NPC',
                        skinName: baseOutfitName,
                        baseSkinName: null,
                        paintedName: null,
                        isPainted: false,
                        imageUrl: finalImgUrl,
                        spriteIndex: spriteIdx,
                        paintedIndex: -1,
                        isEquipped: isBaseEquipped,
                        series: baseSeriesName
                    });

                    const paintedList = sprite.paintedSkins || [];
                    paintedList.forEach((ps, pIdx) => {
                        const inheritedSeries = (ps.series && ps.series.trim()) ? ps.series.trim() : baseSeriesName;
                        const pName = ps.name || `Painted #${pIdx + 1}`;
                        const isPaintedEquipped = (activeSpriteIdx === spriteIdx) && (activePaintedIdx === pIdx);

                        skinList.push({
                            id: `npc_${npc.id}_${spriteIdx}_painted_${pIdx}`,
                            ownerId: npc.id,
                            ownerType: 'NPC',
                            ownerName: npc.name,
                            ownerClass: cleanAffiliation,
                            rarity: 'NPC',
                            skinName: `${baseOutfitName} (${pName})`,
                            baseSkinName: baseOutfitName,
                            paintedName: pName,
                            isPainted: true,
                            imageUrl: ps.url || finalImgUrl,
                            spriteIndex: spriteIdx,
                            paintedIndex: pIdx,
                            isEquipped: isPaintedEquipped,
                            series: inheritedSeries
                        });
                    });
                });
            });

            return skinList;
        }

        function updateSeriesDropdownOptions(allSkins) {
            const currentSelected = seriesFilterSelect.value;
            const uniqueSeries = Array.from(new Set(allSkins.map(s => s.series))).filter(Boolean);

            seriesFilterSelect.innerHTML = `<option value="ALL">✨ Semua Set / Series</option>`;
            uniqueSeries.forEach(series => {
                const option = document.createElement('option');
                option.value = series;
                option.innerText = ` ${formatSeriesName(series)}`;
                seriesFilterSelect.appendChild(option);
            });

            if (uniqueSeries.includes(currentSelected) || currentSelected === 'ALL') {
                seriesFilterSelect.value = currentSelected;
            }
        }

        function renderGallery() {
            const search = (document.getElementById('skinSearch')?.value || '').toLowerCase().trim();
            const equipFilter = document.getElementById('equipFilter')?.value || 'ALL';
            const selectedSeries = seriesFilterSelect?.value || 'ALL';

            const allSkins = getAllSkinsList();
            updateSeriesDropdownOptions(allSkins);

            const filteredSkins = allSkins.filter(skin => {
                const matchCategory = currentCategoryFilter === 'ALL' || 
                                      (currentCategoryFilter === 'PAINTED' ? skin.isPainted : skin.ownerType === currentCategoryFilter);
                const matchSearch = skin.skinName.toLowerCase().includes(search) || 
                                    skin.ownerName.toLowerCase().includes(search) ||
                                    skin.ownerClass.toLowerCase().includes(search) ||
                                    skin.series.toLowerCase().includes(search) ||
                                    (skin.paintedName && skin.paintedName.toLowerCase().includes(search));
                const matchEquip = equipFilter === 'ALL' || 
                                   (equipFilter === 'EQUIPPED' && skin.isEquipped);
                const matchSeries = selectedSeries === 'ALL' || skin.series === selectedSeries;

                return matchCategory && matchSearch && matchEquip && matchSeries;
            });

            skinCountInfo.innerText = `Menampilkan ${filteredSkins.length} Skin/Outfit dari Total ${allSkins.length}`;

            skinGrid.innerHTML = '';

            if (filteredSkins.length === 0) {
                skinGrid.innerHTML = `
                    <div class="col-span-full w-full genshin-card p-12 text-center text-gray-400 text-xs font-genshin tracking-wider">
                        TIDAK ADA SKIN ATAU OUTFIT YANG COCOK DENGAN FILTER ATAU SERIES INI.
                    </div>`;
                return;
            }

            filteredSkins.forEach(skin => {
                let bgClass = 'rarity-master';
                if (skin.ownerType === 'SERVANT') {
                    bgClass = skin.rarity >= 5 ? 'rarity-5' : (skin.rarity === 4 ? 'rarity-4' : 'rarity-3');
                } else if (skin.ownerType === 'NPC') {
                    bgClass = 'rarity-npc';
                }

                const card = document.createElement('div');
                card.className = `genshin-card overflow-hidden cursor-pointer group relative flex flex-col justify-between ${skin.isEquipped ? 'equipped-card ring-2 ring-[#cca566]' : ''}`;
                card.onclick = () => openSkinModal(skin);

                card.innerHTML = `
                    <div class="relative h-56 ${bgClass} flex items-center justify-center overflow-hidden">
                        <img src="${skin.imageUrl}" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='assets/images/favicon.png';" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#161c28] via-transparent to-black/30"></div>
                        
                        <div class="absolute top-2 left-2 flex flex-col gap-1 items-start max-w-[75%]">
                            <span class="bg-black/60 text-[#cca566] text-[9px] px-2 py-0.5 rounded border border-[#cca566]/40 font-bold uppercase backdrop-blur-sm truncate max-w-full">
                                ${skin.ownerClass}
                            </span>
                            ${renderSeriesBadge(skin.series, 'max-w-[125px]')}
                            ${skin.isPainted ? `
                                <span class="skin-badge-painted max-w-[115px] text-[8px] px-1.5 py-0.5 rounded truncate">
                                    🎨 ${skin.paintedName}
                                </span>
                            ` : ''}
                        </div>

                        ${skin.isEquipped ? `
                            <span class="absolute top-2 right-2 bg-[#cca566] text-[#0e121e] text-[9px] px-2 py-0.5 rounded font-bold shadow-md tracking-wider">
                                USED
                            </span>
                        ` : ''}

                        <div class="absolute bottom-2 left-2 right-2 text-left">
                            <span class="text-[9px] text-gray-300 block font-medium truncate">${skin.ownerName}</span>
                            <h4 class="text-xs font-bold text-white truncate font-genshin">${skin.skinName}</h4>
                        </div>
                    </div>

                    <div class="p-2.5 bg-[#161c28]/95 border-t border-gray-800 flex items-center justify-between gap-2">
                        <span class="text-[10px] text-gray-400 truncate">
                            ${skin.isPainted ? `Slot #${skin.spriteIndex + 1} · 🎨 #${skin.paintedIndex + 1}` : `Slot #${skin.spriteIndex + 1}`}
                        </span>
                        <button onclick="event.stopPropagation(); equipSkinDirect('${skin.ownerType}', ${skin.ownerId}, ${skin.spriteIndex}, ${skin.paintedIndex})" 
                                class="text-[10px] font-bold px-3 py-1 rounded transition-colors cursor-pointer ${skin.isEquipped ? 'bg-green-800 text-green-200 cursor-default' : 'bg-[#cca566] hover:bg-[#e2be7d] text-[#0e121e]'}">
                            ${skin.isEquipped ? '✓ Dipakai' : 'Equip Skin'}
                        </button>
                    </div>
                `;
                skinGrid.appendChild(card);
            });
        }

        function equipSkinDirect(ownerType, ownerId, spriteIndex, paintedIndex = -1) {
            if (ownerType === 'SERVANT') {
                const servants = getServants();
                const target = servants.find(s => s.id === ownerId);
                if (target) {
                    target.activeSpriteIndex = spriteIndex;
                    target.activePaintedIndex = paintedIndex;
                    saveServants(servants);

                    const baseName = target.sprites[spriteIndex]?.name || `Stage ${spriteIndex + 1}`;
                    const paintedName = paintedIndex >= 0 ? target.sprites[spriteIndex]?.paintedSkins?.[paintedIndex]?.name : null;
                    const label = paintedName ? `${baseName} (${paintedName})` : baseName;
                    showToast(`Skin "${label}" dipakai untuk ${target.name}!`);
                }
            } else if (ownerType === 'MASTER') {
                const masters = getMasters();
                const target = masters.find(m => m.id === ownerId);
                if (target) {
                    target.activeSpriteIndex = spriteIndex;
                    target.activePaintedIndex = paintedIndex;
                    saveMasters(masters);

                    const baseName = target.sprites[spriteIndex]?.name || `Outfit ${spriteIndex + 1}`;
                    const paintedName = paintedIndex >= 0 ? target.sprites[spriteIndex]?.paintedSkins?.[paintedIndex]?.name : null;
                    const label = paintedName ? `${baseName} (${paintedName})` : baseName;
                    showToast(`Outfit "${label}" dipakai untuk ${target.name}!`);
                }
            } else if (ownerType === 'NPC') {
                const npcs = getNpcs();
                const target = npcs.find(n => n.id === ownerId);
                if (target) {
                    target.activeSpriteIndex = spriteIndex;
                    target.activePaintedIndex = paintedIndex;
                    saveNpcs(npcs);

                    const baseName = target.sprites[spriteIndex]?.name || `Outfit ${spriteIndex + 1}`;
                    const paintedName = paintedIndex >= 0 ? target.sprites[spriteIndex]?.paintedSkins?.[paintedIndex]?.name : null;
                    const label = paintedName ? `${baseName} (${paintedName})` : baseName;
                    showToast(`Outfit "${label}" dipakai untuk NPC ${target.name}!`);
                }
            }
            renderGallery();
            if (activeModalSkin && activeModalSkin.ownerId === ownerId && activeModalSkin.ownerType === ownerType) {
                activeModalSkin.isEquipped = (activeModalSkin.spriteIndex === spriteIndex && activeModalSkin.paintedIndex === paintedIndex);
                updateModalEquipButton();
            }
        }

        function openSkinModal(skin) {
            activeModalSkin = skin;
            document.getElementById('modalSkinImage').src = skin.imageUrl;
            document.getElementById('modalSkinName').innerText = skin.skinName;
            document.getElementById('modalCharOwner').innerText = `${skin.ownerName} (${skin.ownerClass})`;
            document.getElementById('modalTypeBadge').innerText = `${skin.ownerType} COSTUME`;
            
            const modalSeriesBadge = document.getElementById('modalSeriesBadge');
            if (modalSeriesBadge) {
                modalSeriesBadge.className = `${getSeriesColorClass(skin.series)} text-[10px] px-2.5 py-0.5 rounded font-bold font-genshin border inline-flex items-center justify-center`;
                modalSeriesBadge.innerHTML = getBadgeInnerContent(skin.series);
            }

            const modalPaintedBadge = document.getElementById('modalPaintedBadge');
            const modalBaseSkinRow = document.getElementById('modalBaseSkinRow');
            const modalBaseSkinText = document.getElementById('modalBaseSkinText');
            if (skin.isPainted) {
                modalPaintedBadge.innerText = `🎨 ${skin.paintedName}`;
                modalPaintedBadge.classList.remove('hidden');
                modalBaseSkinText.innerText = skin.baseSkinName;
                modalBaseSkinRow.classList.remove('hidden');
            } else {
                modalPaintedBadge.classList.add('hidden');
                modalBaseSkinRow.classList.add('hidden');
            }

            document.getElementById('modalSeriesText').innerText = formatSeriesName(skin.series);

            let categoryLabel = '';
            if (skin.ownerType === 'SERVANT') {
                categoryLabel = skin.isPainted ? 'Servant Painted Skin (Chroma)' : 'Servant Ascension / Skin';
            } else if (skin.ownerType === 'MASTER') {
                categoryLabel = skin.isPainted ? 'Master Painted Outfit (Chroma)' : 'Master Outfit';
            } else {
                categoryLabel = skin.isPainted ? 'NPC Painted Outfit (Chroma)' : 'NPC Outfit / Expression';
            }
            document.getElementById('modalCategory').innerText = categoryLabel;

            document.getElementById('modalSlotIndex').innerText = skin.isPainted
                ? `Slot Sprite #${skin.spriteIndex + 1} · Painted Variant #${skin.paintedIndex + 1}`
                : `Slot Sprite #${skin.spriteIndex + 1}`;

            const imgBg = document.getElementById('modalImageBg');
            let bgRarity = 'rarity-master';
            if (skin.ownerType === 'SERVANT') {
                bgRarity = skin.rarity >= 5 ? 'rarity-5' : 'rarity-4';
            } else if (skin.ownerType === 'NPC') {
                bgRarity = 'rarity-npc';
            }
            imgBg.className = `w-full md:w-1/2 h-72 md:h-96 rounded-lg relative overflow-hidden flex items-center justify-center border border-gray-800 shrink-0 ${bgRarity}`;

            updateModalEquipButton();

            skinModal.classList.remove('hidden');
            setTimeout(() => skinModal.classList.remove('opacity-0'), 10);
        }

        function updateModalEquipButton() {
            if (!activeModalSkin) return;
            const equipBtn = document.getElementById('modalEquipBtn');
            const equippedBadge = document.getElementById('modalEquippedBadge');

            if (activeModalSkin.isEquipped) {
                equippedBadge.classList.remove('hidden');
                equipBtn.innerText = "SKIN SEDANG DIPAKAI ✓";
                equipBtn.disabled = true;
                equipBtn.className = "w-full bg-green-800 text-green-200 font-genshin font-bold text-xs py-3 rounded cursor-default tracking-wider opacity-90";
            } else {
                equippedBadge.classList.add('hidden');
                equipBtn.innerText = "EQUIP SKIN INI 👗";
                equipBtn.disabled = false;
                equipBtn.className = "w-full bg-gradient-to-r from-[#cca566] to-[#b59055] hover:from-[#e2be7d] hover:to-[#cca566] text-[#0e121e] font-genshin font-bold text-xs py-3 rounded transition-all cursor-pointer shadow-lg tracking-wider";
            }
        }

        function equipCurrentModalSkin() {
            if (!activeModalSkin) return;
            equipSkinDirect(activeModalSkin.ownerType, activeModalSkin.ownerId, activeModalSkin.spriteIndex, activeModalSkin.paintedIndex);
            closeSkinModal();
        }

        function closeSkinModal() {
            skinModal.classList.add('opacity-0');
            setTimeout(() => skinModal.classList.add('hidden'), 300);
        }

        function exportAllGalleryData() {
            const combinedData = {
                masters: getMasters(),
                servants: getServants(),
                npcs: getNpcs()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(combinedData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `fate_dominion_full_db_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Full Database (Servants, Masters & NPCs) Exported!");
        }

        function confirmResetAllData() {
            if (confirm("Reset ALL local Servants, Masters & NPCs databases to defaults?")) {
                localStorage.removeItem('fgo_genshin_servants_db_v4');
                localStorage.removeItem('fgo_genshin_servants_db_v2');
                localStorage.removeItem('fgo_genshin_masters_db_v1');
                localStorage.removeItem('fgo_masters_db_v2');
                localStorage.removeItem('fgo_masters_db_v1');
                localStorage.removeItem('fgo_genshin_npcs_db_v1');
                renderGallery();
                showToast("Databases Reset to Standard Defaults!");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        window.onload = function() {
            renderGallery();
        };
    </script>
</body>
</html>
